<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Adventures of Laila &amp; Salma — Animated HD-2D Family Showcase</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="engine/core/hd2d_characters.js"></script>
  <style>
    :root {
      --cream: rgba(253, 248, 238, 0.94);
      --gold: #c99246;
      --gold-dark: #8c5c20;
      --ink: #34251c;
      --muted: #6c5646;
      --sage: #4a7c59;
      --shadow: 0 10px 28px rgba(42, 26, 14, 0.22);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #e8dcc8;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--ink);
    }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
    #stage:active { cursor: grabbing; }

    #top-bar {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 30;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      pointer-events: none; flex-wrap: wrap;
    }
    .pill {
      pointer-events: auto;
      background: var(--cream); border: 2px solid var(--gold);
      border-radius: 16px; padding: 8px 14px; box-shadow: var(--shadow);
      backdrop-filter: blur(8px); display: flex; align-items: center; gap: 10px;
    }
    .title { font-weight: 800; font-size: 15px; line-height: 1.15; }
    .sub { font-size: 11.5px; color: var(--muted); }
    .btn {
      pointer-events: auto; text-decoration: none;
      border: 1.5px solid #d7b278; background: #fffdf8; color: var(--ink);
      font-size: 12px; font-weight: 800; padding: 7px 12px; border-radius: 11px;
      cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn:hover { background: #f8ebd3; border-color: var(--gold-dark); }
    .btn.active { background: var(--gold-dark); color: #fff; border-color: #653f10; }
    .btn.green { background: var(--sage); color: #fff; border-color: #355e41; }
    .btn.green:hover { background: #3b6a49; }

    #roster-bar {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 30;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      pointer-events: none; flex-wrap: wrap;
    }
    .roster-chips {
      pointer-events: auto;
      background: var(--cream); border: 2px solid var(--gold);
      border-radius: 16px; padding: 7px 10px; box-shadow: var(--shadow);
      backdrop-filter: blur(8px); display: flex; gap: 6px; flex-wrap: wrap;
      max-width: 100%;
    }
    .char-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px 4px 4px; border-radius: 999px;
      border: 1.5px solid #dcc08c; background: #fffdf8;
      font-size: 12px; font-weight: 700; color: var(--ink); cursor: pointer;
      transition: all 0.15s;
    }
    .char-chip:hover { background: #f8ebd3; transform: translateY(-1px); }
    .char-chip.active { background: #4a7c59; color: #fff; border-color: #355e41; }
    .char-chip img {
      width: 26px; height: 26px; border-radius: 50%; object-fit: cover;
      border: 1.5px solid var(--gold);
    }
    .hint-box {
      pointer-events: auto;
      background: var(--cream); border: 1.5px solid var(--gold);
      border-radius: 13px; padding: 8px 13px; font-size: 12px; box-shadow: var(--shadow);
    }
    @media (max-width: 760px) {
      .hint-box { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="top-bar">
    <div class="pill">
      <div>
        <div class="title">🌸 Studio Ghibli Animated HD-2D Family</div>
        <div class="sub">Official Watercolor Portraits • 360° 4-Direction Turnaround • True Silhouette Shadows</div>
      </div>
    </div>
    <div class="pill">
      <button id="btn-walk-demo" class="btn active" type="button">🚶 Walk Together</button>
      <button id="btn-turntable" class="btn" type="button">🔄 360° Orbit</button>
      <a class="btn green" href="index.html">🏡 Play Live Preview Game</a>
    </div>
  </div>

  <div id="roster-bar">
    <div class="roster-chips" id="roster-chips"></div>
    <div class="hint-box">
      <strong>WASD / Arrows</strong> or <strong>Click Floor</strong>: Walk Selected Character • <strong>Shift</strong>: Run • <strong>Drag</strong>: Orbit • <strong>Scroll</strong>: Zoom
    </div>
  </div>

  <script>
    (function () {
      const LS = window.LailaSalma;
      const canvas = document.getElementById('stage');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.07;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xdeebf6);

      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 80);

      // Golden Morning Sunlit Ghibli Apartment Lighting
      scene.add(new THREE.HemisphereLight(0xfff6e5, 0xc8a982, 0.94));
      const sun = new THREE.DirectionalLight(0xfff1d6, 1.32);
      sun.position.set(5.2, 8.0, 5.5);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      sun.shadow.camera.near = 0.5;
      sun.shadow.camera.far = 25;
      sun.shadow.camera.left = -7.5;
      sun.shadow.camera.right = 7.5;
      sun.shadow.camera.top = 6.5;
      sun.shadow.camera.bottom = -6.5;
      sun.shadow.bias = -0.0005;
      scene.add(sun);

      const fill = new THREE.DirectionalLight(0xd9eeff, 0.34);
      fill.position.set(-4.5, 3.2, -3.0);
      scene.add(fill);

      const texLoader = new THREE.TextureLoader();
      function loadSRGB(path, rx, ry) {
        const t = texLoader.load(path);
        t.encoding = THREE.sRGBEncoding;
        if (rx && ry) {
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(rx, ry);
        }
        return t;
      }

      // Warm Oak Floor + Woven Rug + Cream Plaster Balcony Wall + Sky
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(15, 11),
        new THREE.MeshStandardMaterial({ map: loadSRGB('assets/ghibli_showcase/wood_floor_ghibli.jpg', 4, 3), roughness: 0.82 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const rug = new THREE.Mesh(
        new THREE.PlaneGeometry(7.8, 3.8),
        new THREE.MeshStandardMaterial({ map: loadSRGB('assets/ghibli_showcase/woven_rug_ghibli.jpg'), roughness: 0.96 })
      );
      rug.rotation.x = -Math.PI / 2;
      rug.position.set(0, 0.006, 0.2);
      rug.receiveShadow = true;
      scene.add(rug);

      const wallMat = new THREE.MeshStandardMaterial({ map: loadSRGB('assets/ghibli_showcase/plaster_wall.jpg', 3, 1), roughness: 0.92 });
      const bLeft = new THREE.Mesh(new THREE.BoxGeometry(5.2, 3.8, 0.24), wallMat);
      bLeft.position.set(-4.6, 1.9, -3.2); bLeft.receiveShadow = true; scene.add(bLeft);
      const bRight = new THREE.Mesh(new THREE.BoxGeometry(5.2, 3.8, 0.24), wallMat);
      bRight.position.set(4.6, 1.9, -3.2); bRight.receiveShadow = true; scene.add(bRight);
      const bTop = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.95, 0.24), wallMat);
      bTop.position.set(0, 3.32, -3.2); scene.add(bTop);

      const sky = new THREE.Mesh(
        new THREE.PlaneGeometry(14, 7),
        new THREE.MeshBasicMaterial({ map: loadSRGB('assets/ghibli_showcase/sky_panorama.jpg') })
      );
      sky.position.set(0, 2.5, -5.6);
      scene.add(sky);

      const railMat = new THREE.MeshStandardMaterial({ color: 0x5c4637, roughness: 0.65, metalness: 0.15 });
      const topRail = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.05, 0.06), railMat);
      topRail.position.set(0, 1.02, -3.5);
      scene.add(topRail);
      for (let rx = -1.96; rx <= 1.98; rx += 0.28) {
        const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 1.02, 6), railMat);
        bar.position.set(rx, 0.51, -3.5);
        scene.add(bar);
      }

      // Potted Ghibli plants
      function addPlant(src, x, z, w, h) {
        const tex = loadSRGB(src);
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(w, h),
          new THREE.MeshStandardMaterial({ map: tex, transparent: true, alphaTest: 0.35, roughness: 0.9, side: THREE.DoubleSide })
        );
        m.position.set(x, h * 0.5, z);
        m.castShadow = true;
        m.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: 0.35 });
        scene.add(m);
      }
      addPlant('assets/ghibli_showcase/potted_lemon.png', -4.2, -2.35, 1.45, 1.78);
      addPlant('assets/ghibli_showcase/potted_flowers.png', 4.1, -2.35, 1.0, 1.05);

      // Soft contact shadow generator
      const shadowCanvas = document.createElement('canvas');
      shadowCanvas.width = 128; shadowCanvas.height = 128;
      const sctx = shadowCanvas.getContext('2d');
      const sg = sctx.createRadialGradient(64, 64, 6, 64, 64, 58);
      sg.addColorStop(0, 'rgba(42,26,14,0.34)');
      sg.addColorStop(1, 'rgba(42,26,14,0)');
      sctx.fillStyle = sg; sctx.fillRect(0, 0, 128, 128);
      const shadowTex = new THREE.CanvasTexture(shadowCanvas);

      function makeNamePlate(label, heightM) {
        const c = document.createElement('canvas');
        c.width = 320; c.height = 68;
        const ctx = c.getContext('2d');
        ctx.fillStyle = 'rgba(253,248,238,0.92)';
        ctx.beginPath();
        ctx.roundRect(12, 8, 296, 52, 16);
        ctx.fill();
        ctx.strokeStyle = '#c99246';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.fillStyle = '#34251c';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(label, 160, 43);
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false, toneMapped: false }));
        sp.scale.set(0.76, 0.16, 1);
        sp.position.y = heightM + 0.16;
        return sp;
      }

      // Full 10-Character Family Lineup (Real-World Calibrated Heights!)
      const FAMILY = [
        { key: 'laila',        label: 'Laila (1.24m)',        x: -0.65, z:  1.25, rotY:  0.08 },
        { key: 'salma',        label: 'Salma (1.04m)',        x:  0.55, z:  1.25, rotY: -0.08 },
        { key: 'mom',          label: 'Mom (1.58m)',          x: -2.28, z:  0.35, rotY:  0.16 },
        { key: 'dad',          label: 'Dad (1.72m)',          x:  2.38, z:  0.35, rotY: -0.16 },
        { key: 'gedo_mahmoud', label: 'Gedo Mahmoud (1.68m)', x: -3.55, z: -0.35, rotY:  0.24 },
        { key: 'nana_omaima',  label: 'Nana Omaima (1.54m)',  x: -1.55, z: -1.05, rotY:  0.08 },
        { key: 'bibo',         label: 'Bibo (0.99m)',         x: -0.35, z: -0.88, rotY:  0.02 },
        { key: 'nouzi',        label: 'Nouzi (1.22m)',        x:  0.68, z: -0.98, rotY: -0.04 },
        { key: 'mai',          label: 'Mai (1.56m)',          x:  1.68, z: -1.05, rotY: -0.10 },
        { key: 'mostafa',      label: 'Mostafa (1.72m)',      x:  3.55, z: -0.35, rotY: -0.24 }
      ];

      const actors = {};
      const chipsWrap = document.getElementById('roster-chips');
      let activeKey = 'laila';
      let demoWalk = true;
      let autoOrbit = false;

      FAMILY.forEach(item => {
        const rig = LS.createHD2DRig(item.key);
        if (!rig) return;
        const root = new THREE.Group();
        root.position.set(item.x, 0, item.z);
        root.rotation.y = item.rotY;

        const disc = new THREE.Mesh(
          new THREE.PlaneGeometry(0.74, 0.74),
          new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
        );
        disc.rotation.x = -Math.PI / 2;
        disc.position.y = 0.015;
        root.add(disc);
        root.add(rig.group);
        root.add(makeNamePlate(item.label, rig.heightM));
        scene.add(root);

        actors[item.key] = {
          key: item.key,
          root,
          rig,
          homeX: item.x,
          homeZ: item.z,
          walkTarget: null
        };

        const chip = document.createElement('button');
        chip.className = 'char-chip' + (item.key === activeKey ? ' active' : '');
        chip.type = 'button';
        chip.dataset.key = item.key;
        chip.innerHTML = '<img src="assets/ghibli_showcase/portraits/' + item.key + '_card.jpg" alt="' + item.label + '" /><span>' + item.label.split(' (')[0] + '</span>';
        chip.onclick = () => {
          activeKey = item.key;
          demoWalk = false;
          document.getElementById('btn-walk-demo').classList.remove('active');
          chipsWrap.querySelectorAll('.char-chip').forEach(b => b.classList.toggle('active', b.dataset.key === activeKey));
        };
        chipsWrap.appendChild(chip);
      });

      document.getElementById('btn-walk-demo').onclick = e => {
        demoWalk = !demoWalk;
        e.target.classList.toggle('active', demoWalk);
      };
      document.getElementById('btn-turntable').onclick = e => {
        autoOrbit = !autoOrbit;
        e.target.classList.toggle('active', autoOrbit);
      };

      // Controls: Orbit + Click-to-Walk + WASD
      let camYaw = 0.0;
      let camPitch = 0.21;
      let camDist = 6.9;
      let dragging = false, dragMoved = 0, lastX = 0, lastY = 0;
      const keys = {};
      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();

      canvas.addEventListener('pointerdown', e => { dragging = true; dragMoved = 0; lastX = e.clientX; lastY = e.clientY; });
      window.addEventListener('pointermove', e => {
        if (!dragging) return;
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        dragMoved += Math.abs(dx) + Math.abs(dy);
        lastX = e.clientX; lastY = e.clientY;
        camYaw -= dx * 0.0065;
        camPitch = Math.max(0.05, Math.min(0.85, camPitch + dy * 0.005));
      });
      window.addEventListener('pointerup', e => {
        if (!dragging) return;
        dragging = false;
        if (dragMoved < 6) {
          const rect = canvas.getBoundingClientRect();
          pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(pointerNDC, camera);
          const hits = raycaster.intersectObject(floor);
          if (hits.length && actors[activeKey]) {
            demoWalk = false;
            document.getElementById('btn-walk-demo').classList.remove('active');
            const p = hits[0].point;
            actors[activeKey].walkTarget = new THREE.Vector3(
              Math.max(-5.2, Math.min(5.2, p.x)), 0, Math.max(-2.2, Math.min(3.2, p.z))
            );
          }
        }
      });
      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        camDist = Math.max(2.6, Math.min(11.0, camDist + e.deltaY * 0.0035));
      }, { passive: false });
      window.addEventListener('keydown', e => { keys[e.code] = true; });
      window.addEventListener('keyup', e => { keys[e.code] = false; });
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const clock = new THREE.Clock();
      const camFocus = new THREE.Vector3(0, 0.85, 0.0);

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const elapsed = clock.elapsedTime;

        if (autoOrbit && !dragging) camYaw += dt * 0.52;

        // Playful figure-8 stroll for Laila & Salma when "Walk Together" demo is active
        if (demoWalk && actors.laila && actors.salma) {
          const tL = elapsed * 0.65;
          const lx = Math.sin(tL) * 1.55;
          const lz = 1.48 + Math.sin(tL * 2) * 0.34;
          const dxL = lx - actors.laila.root.position.x;
          const dzL = lz - actors.laila.root.position.z;
          actors.laila.root.position.set(lx, 0, lz);
          actors.laila.root.rotation.y = Math.atan2(dxL, dzL);

          const tS = tL - 0.55;
          const sx = Math.sin(tS) * 1.55;
          const sz = 1.48 + Math.sin(tS * 2) * 0.34;
          const dxS = sx - actors.salma.root.position.x;
          const dzS = sz - actors.salma.root.position.z;
          actors.salma.root.position.set(sx, 0, sz);
          actors.salma.root.rotation.y = Math.atan2(dxS, dzS);
        } else if (actors[activeKey]) {
          const act = actors[activeKey];
          let mx = 0, mz = 0;
          if (keys['KeyW'] || keys['ArrowUp']) mz -= 1;
          if (keys['KeyS'] || keys['ArrowDown']) mz += 1;
          if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
          if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
          const spd = (keys['ShiftLeft'] || keys['ShiftRight']) ? 3.5 : 2.1;

          if (mx !== 0 || mz !== 0) {
            act.walkTarget = null;
            const len = Math.hypot(mx, mz); mx /= len; mz /= len;
            const sinY = Math.sin(camYaw), cosY = Math.cos(camYaw);
            const wx = mx * cosY + mz * sinY;
            const wz = -mx * sinY + mz * cosY;
            act.root.position.x = Math.max(-5.2, Math.min(5.2, act.root.position.x + wx * spd * dt));
            act.root.position.z = Math.max(-2.2, Math.min(3.2, act.root.position.z + wz * spd * dt));
            act.root.rotation.y = Math.atan2(wx, wz);
          } else if (act.walkTarget) {
            const dx = act.walkTarget.x - act.root.position.x;
            const dz = act.walkTarget.z - act.root.position.z;
            const d = Math.hypot(dx, dz);
            if (d > 0.08) {
              const step = Math.min(d, spd * dt);
              act.root.position.x += (dx / d) * step;
              act.root.position.z += (dz / d) * step;
              act.root.rotation.y = Math.atan2(dx, dz);
            } else {
              act.walkTarget = null;
            }
          }
        }

        Object.values(actors).forEach(a => a.rig.update(dt, elapsed, camera));

        const targetFocus = demoWalk
          ? new THREE.Vector3(0, 0.85, 0.05)
          : new THREE.Vector3(actors[activeKey].root.position.x * 0.45, 0.85, actors[activeKey].root.position.z * 0.45);
        camFocus.lerp(targetFocus, Math.min(1, dt * 4));

        camera.position.set(
          camFocus.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist,
          camFocus.y + Math.sin(camPitch) * camDist,
          camFocus.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist
        );
        camera.lookAt(camFocus);
        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>
</body>
</html>
